name: Release

# Before the first tag, run npm-bootstrap.yml under its protected environment,
# then configure release.yml as the trusted publisher for all three npm
# packages. Tag releases intentionally use OIDC only and refuse to create new
# package names with a long-lived token.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BENCHGUARD_GITHUB_SERVER_URL: ${{ github.server_url }}
  BENCHGUARD_GITHUB_REPOSITORY: ${{ github.repository }}
  BENCHGUARD_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify release versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BENCHGUARD_RELEASE_TAG }}
      - name: Match tag, Cargo, and npm versions
        run: node .github/scripts/verify-release-version.mjs "${BENCHGUARD_RELEASE_TAG}"

  ci:
    name: Full CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ inputs.release_tag || github.ref_name }}
    permissions:
      contents: read

  build-artifacts:
    name: Build / ${{ matrix.target }}
    needs:
      - verify
      - ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: benchguard
            artifact: release-linux
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: benchguard.exe
            artifact: release-windows
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BENCHGUARD_RELEASE_TAG }}
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Select stable Rust
        run: rustup default stable
      - name: Build stripped release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify binary version
        shell: bash
        run: |
          expected="${BENCHGUARD_RELEASE_TAG#v}"
          actual="$(target/${{ matrix.target }}/release/${{ matrix.executable }} --version)"
          [[ "$actual" == "benchguard $expected" ]]
      - name: Create Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${BENCHGUARD_RELEASE_TAG#v}"
          directory="benchguard-${version}-${{ matrix.target }}"
          mkdir -p "dist/$directory"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            README.md LICENSE-MIT LICENSE-APACHE "dist/$directory/"
          tar -C dist -czf "dist/$directory.tar.gz" "$directory"
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:BENCHGUARD_RELEASE_TAG.Substring(1)
          $directory = "benchguard-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$directory" | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/${{ matrix.executable }}", `
            "README.md", "LICENSE-MIT", "LICENSE-APACHE" `
            -Destination "dist/$directory"
          Compress-Archive -Path "dist/$directory" -DestinationPath "dist/$directory.zip"
      - name: Upload platform archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  checksums:
    name: Generate checksums
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Download platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
      - name: Upload complete release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: checksums
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$BENCHGUARD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; replacing assets safely."
            gh release upload "$BENCHGUARD_RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$BENCHGUARD_RELEASE_TAG" dist/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  publish-npm-native:
    name: Publish native npm packages
    needs: github-release
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BENCHGUARD_RELEASE_TAG }}
      - name: Install publishing Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Stage native package binaries
        shell: bash
        run: |
          version="${BENCHGUARD_RELEASE_TAG#v}"
          mkdir -p dist/linux dist/windows
          tar -xzf "dist/benchguard-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            -C dist/linux
          unzip -q "dist/benchguard-${version}-x86_64-pc-windows-msvc.zip" \
            -d dist/windows
          linux_root="dist/linux/benchguard-${version}-x86_64-unknown-linux-gnu"
          windows_root="dist/windows/benchguard-${version}-x86_64-pc-windows-msvc"
          cp "$linux_root/benchguard" npm/linux-x64/benchguard
          chmod 755 npm/linux-x64/benchguard
          cp "$windows_root/benchguard.exe" npm/win32-x64/benchguard.exe
          for package in npm/linux-x64 npm/win32-x64; do
            cp README.md LICENSE-MIT LICENSE-APACHE "$package/"
          done
          node .github/scripts/prepare-npm-manifests.mjs
      - name: Publish native packages when absent
        shell: bash
        run: |
          version="${BENCHGUARD_RELEASE_TAG#v}"
          registry_status() {
            local encoded="$1"
            local suffix="${2:-}"
            curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/${encoded}${suffix}"
          }
          publish_existing_package() {
            local name="$1"
            local encoded="$2"
            local directory="$3"
            local package_status version_status
            package_status="$(registry_status "$encoded")"
            case "$package_status" in
              200) ;;
              404)
                echo "::error::$name does not exist. Run npm-bootstrap.yml first, configure its trusted publisher for release.yml, then retry the release." >&2
                exit 1
                ;;
              *) echo "npm registry returned HTTP $package_status for $name" >&2; exit 1 ;;
            esac
            version_status="$(registry_status "$encoded" "/$version")"
            case "$version_status" in
              200) echo "$name@$version already exists; skipping." ;;
              404) npm publish "$directory" --access public ;;
              *) echo "npm registry returned HTTP $version_status for $name@$version" >&2; exit 1 ;;
            esac
          }
          publish_existing_package \
            '@benchguard/linux-x64' '%40benchguard%2Flinux-x64' ./npm/linux-x64
          publish_existing_package \
            '@benchguard/win32-x64' '%40benchguard%2Fwin32-x64' ./npm/win32-x64

  publish-npm-cli:
    name: Publish npm CLI package
    needs: publish-npm-native
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BENCHGUARD_RELEASE_TAG }}
      - name: Install publishing Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Stage CLI documentation
        run: |
          cp README.md LICENSE-MIT LICENSE-APACHE npm/cli/
          node .github/scripts/prepare-npm-manifests.mjs
      - name: Publish CLI package when absent
        shell: bash
        run: |
          version="${BENCHGUARD_RELEASE_TAG#v}"
          package_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "https://registry.npmjs.org/%40benchguard%2Fcli")"
          case "$package_status" in
            200) ;;
            404)
              echo "::error::@benchguard/cli does not exist. Run npm-bootstrap.yml first, configure its trusted publisher for release.yml, then retry the release." >&2
              exit 1
              ;;
            *) echo "npm registry returned HTTP $package_status for @benchguard/cli" >&2; exit 1 ;;
          esac
          version_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "https://registry.npmjs.org/%40benchguard%2Fcli/${version}")"
          case "$version_status" in
            200) echo "@benchguard/cli@$version already exists; skipping." ;;
            404) npm publish ./npm/cli --access public ;;
            *) echo "npm registry returned HTTP $version_status for @benchguard/cli@$version" >&2; exit 1 ;;
          esac

  publish-cargo:
    name: Publish Cargo crate
    needs: publish-npm-cli
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BENCHGUARD_RELEASE_TAG }}
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Select stable Rust
        run: rustup default stable
      - name: Publish crate when absent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          version="${BENCHGUARD_RELEASE_TAG#v}"
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/benchguard/${version}")"
          case "$status" in
            200) echo "benchguard@$version already exists; skipping." ;;
            404) cargo publish --locked ;;
            *) echo "crates.io returned HTTP $status" >&2; exit 1 ;;
          esac
